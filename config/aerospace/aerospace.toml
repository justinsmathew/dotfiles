# AeroSpace Configuration
# https://github.com/nikitabobko/AeroSpace

# Start AeroSpace at login
start-at-login = true

# Start JankyBorders on startup
# Focus external monitor to workspace 1 on startup
after-startup-command = [
  'exec-and-forget borders active_color=0xffDC143C inactive_color=0xff494d64 width=5.0',
  'exec-and-forget sleep 1 && aerospace workspace 1'
]

# Notify sketchybar on workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change'
]

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# Gaps between windows
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.bottom = [
  { monitor."built-in" = 5 },
  { monitor."main" = 8 },
  8
]
outer.top = [
  { monitor."built-in" = 10 },
  { monitor."main" = 48 },
  48
]
outer.left = [
  { monitor."built-in" = 5 },
  { monitor."main" = 8 },
  8
]
outer.right = [
  { monitor."built-in" = 5 },
  { monitor."main" = 8 },
  8
]

# Main mode bindings
[mode.main.binding]

# ============================================
# APPLICATION KEYBINDINGS
# ============================================
# Open WezTerm with Ctrl + Shift + Enter
ctrl-shift-enter = 'exec-and-forget open -n -a WezTerm'

# Open Zen Browser with Ctrl + Shift + B
ctrl-shift-b = 'exec-and-forget open -n -a "Zen Browser"'

# Open Spotify with Ctrl + Shift + M
ctrl-shift-m = 'exec-and-forget open -n -a Spotify'

# Open Discord with Ctrl + Shift + D
ctrl-shift-d = 'exec-and-forget open -n -a Discord'

# Add more application keybindings below:
# Examples:
# alt-c = 'exec-and-forget open -a "Visual Studio Code"'
# alt-s = 'exec-and-forget open -a Slack'
# alt-f = 'exec-and-forget open -a Finder'

# ============================================
# WORKSPACE NAVIGATION (1-9 only)
# ============================================
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# ============================================
# MOVE WINDOWS TO WORKSPACES (and follow)
# ============================================
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# ============================================
# WINDOW FOCUS (vim-style navigation)
# ============================================
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Cycle through windows in current workspace (like Alt+Tab)
alt-tab = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-next'

# Switch focus between monitors (easy back and forth)
alt-shift-tab = 'focus-monitor --wrap-around next'

# ============================================
# MOVE WINDOWS (vim-style navigation)
# ============================================
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Move window to monitors
alt-shift-f = 'move-node-to-monitor 1'  # Move to external monitor (M27Q)
alt-shift-a = 'move-node-to-monitor 2'  # Move to built-in display

# ============================================
# LAYOUT CONTROLS
# ============================================
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'

# Toggle between floating and tiling
alt-shift-space = 'layout floating tiling'

# Close focused window
alt-shift-q = 'close'

# ============================================
# MODE SWITCHING
# ============================================
alt-r = 'mode resize'
alt-shift-semicolon = 'mode service'

# ============================================
# RESIZE MODE
# ============================================
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# ============================================
# SERVICE MODE
# ============================================
[mode.service.binding]
r = ['reload-config', 'mode main']
esc = 'mode main'
backspace = ['close-all-windows-but-current', 'mode main']

# ============================================
# WINDOW RULES - Auto-assign apps to workspaces
# ============================================

# Automatically move WezTerm to workspace 1
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace 1'

# Automatically move Zen Browser to workspace 2
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 2'

# Automatically move Discord to workspace 3
[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

# Automatically move Spotify to workspace 5
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 5'
