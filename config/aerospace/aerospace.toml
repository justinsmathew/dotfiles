# AeroSpace Configuration
# https://github.com/nikitabobko/AeroSpace

config-version = 2

# Core workspaces always exist even when empty; 6-9 are created on demand.
persistent-workspaces = ['1', '2', '3', '4', '5']

# Start AeroSpace at login
start-at-login = true

# Start JankyBorders on startup (reads ~/.config/borders/bordersrc)
after-startup-command = ['exec-and-forget borders']

# Notify sketchybar on workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Gaps between windows. sketchybar (32px) lives inside the strip macOS
# already reserves at the top of the built-in display, so outer.top only
# needs a sliver of clearance for the window border.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.top = 2
outer.bottom = 8
outer.left = 8
outer.right = 8

# Main mode bindings
[mode.main.binding]

# ============================================
# APPLICATION LAUNCHING
# ============================================
# Apps launch from the Hyper key (Right Command) via Karabiner:
#   Hyper+Return=Ghostty  Hyper+B=Helium  Hyper+E=Finder  Hyper+D=Discord
#   Hyper+M=Spotify  Hyper+O=Obsidian  Hyper+C=Calculator
# Config: ~/.config/karabiner/karabiner.json

# ============================================
# WORKSPACE NAVIGATION
# ============================================
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# ============================================
# MOVE WINDOWS TO WORKSPACES (and follow)
# ============================================
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# ============================================
# WINDOW FOCUS (vim-style navigation)
# ============================================
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Cycle through windows in current workspace (like Alt+Tab)
alt-tab = 'focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-next'

# ============================================
# MOVE WINDOWS (vim-style navigation)
# ============================================
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# ============================================
# LAYOUT CONTROLS
# ============================================
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'
alt-t = 'layout floating tiling'
alt-q = 'close'

# ============================================
# MODE SWITCHING
# ============================================
alt-r = 'mode resize'
alt-shift-semicolon = 'mode service'

# ============================================
# RESIZE MODE
# ============================================
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# ============================================
# SERVICE MODE
# ============================================
[mode.service.binding]
r = ['reload-config', 'mode main']
esc = 'mode main'
backspace = ['close-all-windows-but-current', 'mode main']

# ============================================
# WINDOW RULES - Auto-assign apps to workspaces
# ============================================
# on-window-detected fires only when a window is created, so windows can
# still be moved to any workspace afterwards with alt-shift-N.

# Workspace 1: terminal
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

# Workspace 2: browsers
[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 2'

# Workspace 3: Discord
[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

# Workspace 4: Obsidian
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 4'

# Workspace 5: music
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'move-node-to-workspace 5'

# Workspace 6: Claude Desktop
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 6'

# Float small utility windows instead of tiling them
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'
